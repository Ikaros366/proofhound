# dirsearch —— 字典爆路径 / 目录与文件发现工具（M16-b，L1 主动发现类）
#
# 版本 pin + **每一条发行件**的 SHA256 均为 PyPI 发行件实测值（本地下载重算，
# 与 PyPI JSON API 的 digests.sha256 逐条一致）；升级走显式动作并重新校验哈希。
#
# 依赖闭包（closure）：dirsearch 是本项目**第一个依赖闭包非空**的 pip 工具
# （sqlmap 零依赖）。installer 的 pip 配方据此在 --no-index 下把整条闭包
# （含 cryptography —— 经 requests-ntlm → spnego → cryptography.hazmat **真被导入**，
# 见 AGENTS.md 限制 55 的实测记录）一并装进 ./tools.d/dirsearch/lib，并用
# --require-hashes 强制**每个** wheel 的哈希。
#
# 闭包按 **musllinux** 目标平台解析（沙箱镜像是 python:3.12-alpine）：cryptography /
# cffi / markupsafe / charset-normalizer 取的是 musllinux wheel。故 installer 走
# 闭包路径时会交叉选择 wheel 平台（宿主机是 glibc，直接 pip install 找不到这些 wheel）。
#
# 注：closure **只列依赖**，dirsearch 本体由 install 条目自己的 package/sha256 给出。
name: dirsearch
version: "0.5.0"
check: "dirsearch --version"
install:
  - type: local                    # 1. 用户预置目录（离线零下载；仓内 .gitignore 排除）
    path: ./tools.d/dirsearch
  - type: pip                      # 2. PyPI 版本 pin + 强制 sha256 + 依赖闭包
    package: "dirsearch==0.5.0"
    sha256: "10dc3476fdc9e71d7a0f41b2745b2261f3a1833f4f8c9db9b3b9c6dfe41c9597"
    closure:
      - package: "PySocks==1.7.1"
