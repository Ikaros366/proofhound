[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofhound"
version = "0.3.0"
description = "证据驱动、验证优先的自动化渗透测试 Agent 系统（证据门控反误报 / Docker 沙箱工具链 / LLM 三档路由与预算硬闸 / 模板化报告）"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ikaros366" }]
keywords = ["pentest", "security", "agent", "llm", "verification", "sqlmap", "dvwa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "docker>=7.0",
    "docxtpl>=0.16",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.62",  # M8b：verify-xss 无头浏览器行为确认（懒导入，缺浏览器二进制时 xss 验证 fail-closed）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-docx>=1.1",
    "httpx>=0.27",  # FastAPI TestClient 依赖
]

[tool.setuptools.packages.find]
include = ["proofhound*"]

[tool.setuptools.package-data]
"proofhound.tools" = ["manifests/*.yaml"]
"proofhound.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: 需要可用 Docker 守护进程的测试",
    "browser: 需要 Playwright Chromium 浏览器二进制的测试（playwright install chromium）",
]
